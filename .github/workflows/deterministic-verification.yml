name: deterministic-verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows deterministic gate
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CI: "true"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out canonical inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Compile and run deterministic tests
        run: python -m compileall -q scripts tests && python -m unittest discover -s tests -v

      - name: Prove canonical files remain unchanged
        shell: pwsh
        run: |
          $changes = git status --short --untracked-files=no
          if ($changes) {
            $changes
            throw "deterministic gate modified canonical files"
          }
